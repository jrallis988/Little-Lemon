[package]
name = "mailbox"
version = "0.1.0"
description = "Mailbox — email for students in grades 1–12"
authors = ["Mailbox"]
edition = "2021"

[lib]
name = "mailbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
