[package]
name = "surf"
version = "0.1.0"
description = "Surf — child-safe search-first educational browser"
authors = ["Surf"]
edition = "2021"

[lib]
name = "surf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.27.0"
tokio = "1.53.1"
aes-gcm = "0.10.3"
base64 = "0.23.0"
thiserror = "2.0.19"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
