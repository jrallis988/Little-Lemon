[[permission]]
identifier = "surf-custom-commands"
description = "Allows Surf chrome to call native browser, search, filter, PIN, storage, and window commands."
commands.allow = [
  "check_url",
  "verify_parent_pin",
  "minimize_window",
  "close_window",
  "secure_get",
  "secure_set",
  "parent_secure_set",
  "parent_secure_get",
  "browser_create_tab",
  "browser_navigate",
  "browser_close_tab",
  "browser_show_tab",
  "browser_hide_tab",
  "browser_reload",
  "browser_go_back",
  "browser_go_forward",
  "browser_set_chrome_height",
  "browser_find_in_page",
  "educational_search",
  "set_parent_allowlist",
]
