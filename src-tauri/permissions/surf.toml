[[permission]]
identifier = "surf-custom-commands"
description = "Allows Surf chrome to call academic search, article fetch, filter, PIN, storage, and window commands."
commands.allow = [
  "academic_search",
  "fetch_article",
  "check_url",
  "verify_parent_pin",
  "minimize_window",
  "close_window",
  "secure_get",
  "secure_set",
]
