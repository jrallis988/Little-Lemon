services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trumprx
      POSTGRES_PASSWORD: trumprx
      POSTGRES_DB: trumprx
    ports:
      - "5432:5432"
    volumes:
      - trumprx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trumprx -d trumprx"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trumprx:trumprx@db:5432/trumprx
      AUTH_SECRET: change-me-to-a-long-random-secret-32chars
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_EMAILS: ops@example.com
    depends_on:
      db:
        condition: service_healthy

volumes:
  trumprx_pg:
