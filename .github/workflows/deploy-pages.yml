name: CI and GitHub Pages

on:
  push:
    # Motel site only — do not deploy from main (Artistic Fountain portfolio).
    branches: ["cursor/beach-motel-website-1cb8", "seascape"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      # Deploy Seascape from the motel branch (main is the Artistic Fountain portfolio).
      - if: github.ref == 'refs/heads/cursor/beach-motel-website-1cb8' || github.ref == 'refs/heads/seascape'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/cursor/beach-motel-website-1cb8' || github.ref == 'refs/heads/seascape'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
