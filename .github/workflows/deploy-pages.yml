name: Deploy Little Lemon to GitHub Pages

on:
  push:
    branches: ["cursor/little-lemon-multi-index-bc64"]
  pull_request:
    branches: ["cursor/little-lemon-multi-index-bc64"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-little-lemon
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static site
        run: |
          mkdir -p _site
          cp *.html *.css *.js *.svg *.txt *.xml *.md package.json _site/ 2>/dev/null || true
          cp -r images _site/
          # Do not ship Weiboo PHP reference dump to Pages
          rm -f _site/STATUS.md 2>/dev/null || true
          ls -la _site
      - if: github.ref == 'refs/heads/cursor/little-lemon-multi-index-bc64'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/cursor/little-lemon-multi-index-bc64'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::notice title=GitHub Pages not enabled yet::Open https://github.com/${{ github.repository }}/settings/pages and set Source to GitHub Actions, then re-run this workflow."
          fi

      - id: deployment
        if: steps.pages.outputs.status == '200'
        uses: actions/deploy-pages@v4

      - name: Skip deploy until Pages is enabled
        if: steps.pages.outputs.status != '200'
        run: |
          echo "Skipping deploy — enable Pages (Source: GitHub Actions), then re-run."
