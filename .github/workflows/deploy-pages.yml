name: CI and GitHub Pages

on:
  push:
    # Motel site only — do not deploy from main (Artistic Fountain portfolio).
    branches: ["cursor/beach-motel-website-1cb8", "seascape"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build
      # Deploy Seascape from the motel branch (main is the Artistic Fountain portfolio).
      - if: github.ref == 'refs/heads/cursor/beach-motel-website-1cb8' || github.ref == 'refs/heads/seascape'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/cursor/beach-motel-website-1cb8' || github.ref == 'refs/heads/seascape'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages API status: $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=GitHub Pages not enabled yet::Open https://github.com/${{ github.repository }}/settings/pages and set Source to GitHub Actions, then re-run this workflow."
          fi

      - id: deployment
        if: steps.pages.outputs.status == '200'
        uses: actions/deploy-pages@v4

      - name: Skip deploy until Pages is enabled
        if: steps.pages.outputs.status != '200'
        run: |
          echo "Skipping deploy — GitHub Pages is not enabled on this repository yet."
          echo "Enable it here: https://github.com/${{ github.repository }}/settings/pages"
          echo "Choose Source: GitHub Actions, then re-run this workflow."
