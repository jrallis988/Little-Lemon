name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: courtside-app/package-lock.json

      - name: Install COURTSIDE deps
        working-directory: courtside-app
        run: npm ci

      - name: Build COURTSIDE → /courtside/
        working-directory: courtside-app
        env:
          COURTSIDE_SITE_URL: https://jrallis988.github.io/Little-Lemon/courtside
        run: npm run build

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '_site' \
            --exclude 'courtside-app' \
            --exclude 'node_modules' \
            --exclude '.github' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
