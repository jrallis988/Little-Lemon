name: CI

on:
  push:
    branches: [main, cursor/frontend-portfolio-d3d8]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false --forceExit
      - run: npm run build
        env:
          CI: false
          PUBLIC_URL: /Little-Lemon
