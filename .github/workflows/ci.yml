name: ci

on:
  push:
    branches: [cursor/planet-fitness-club-pricing-2f73, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-auth-secret-not-for-production
          ACCESS_CONTROL_SECRET: ci-access-secret-not-for-production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
