<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop pet food, toys, health products, grooming supplies, and habitats at PetSmart.">
  <title>Shop — PetSmart</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
<div id="ps-header" data-base="../" data-active="shop"></div>

  <main id="main">
    <div class="page-hero">
      <div class="page-hero__inner container">
        <h1>Shop</h1>
        <p>Food, toys, health, grooming supplies, and habitats — everything your pet needs, organized by category.</p>
      </div>
    </div>

    <section class="section">
      <div class="container">
        <h2 class="reveal" style="margin-bottom:var(--space-8);">Top categories</h2>
        <div class="grid-3" id="category-grid"></div>
      </div>
    </section>

    <section class="section section--pale">
      <div class="container">
        <div class="shop-toolbar reveal">
          <h2>All products</h2>
          <label class="text-small">Sort by
            <select class="form-select" id="sort-select" style="width:auto; display:inline-block; margin-left:var(--space-2);">
              <option value="rating">Top rated</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <div class="grid-4" id="product-grid"></div>
      </div>
    </section>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    document.getElementById('category-grid').innerHTML =
      PetSmartData.categories.map(c => PetSmartUI.categoryCard(c, '../')).join('');
    const grid = document.getElementById('product-grid');
    const sortSelect = document.getElementById('sort-select');
    function render() { PetSmartUI.renderProductGrid(grid, PetSmartData.getProducts({ sort: sortSelect.value }), '../'); }
    sortSelect.addEventListener('change', render);
    render();
  </script>
</body>
</html>
