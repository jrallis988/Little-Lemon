<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — PetSmart Shop</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="header"><div class="header-inner">
    <a class="brand" href="../index.html"><span class="brand-text"><span class="pet">Pet</span><span class="smart">Smart</span></span></a>
    <nav aria-label="Primary"><ul class="header-nav"><li><a href="index.html">Shop</a></li></ul></nav>
  </div></header>

  <main id="main">
    <div class="page-hero"><div class="page-hero__inner container"><h1>Your cart</h1></div></div>
    <div class="cart-layout">
      <div id="cart-items"></div>
      <aside class="cart-summary" aria-label="Order summary">
        <h2 style="font-size:var(--text-xl); margin-bottom:var(--space-4);">Order summary</h2>
        <p style="display:flex; justify-content:space-between; margin-bottom:var(--space-2);"><span>Subtotal</span><span id="subtotal">$0.00</span></p>
        <p style="display:flex; justify-content:space-between; margin-bottom:var(--space-4);" class="text-muted text-small"><span>Shipping</span><span>Calculated at checkout</span></p>
        <p style="display:flex; justify-content:space-between; font-weight:700; font-size:var(--text-lg); margin-bottom:var(--space-6);"><span>Estimated total</span><span id="total">$0.00</span></p>
        <a class="btn btn-primary" href="../checkout/index.html" style="width:100%;" id="checkout-btn">Proceed to checkout</a>
      </aside>
    </div>
  </main>

  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    function renderCart() {
      const cart = PetSmartCart.get();
      const container = document.getElementById('cart-items');
      const checkoutBtn = document.getElementById('checkout-btn');
      if (!cart.length) {
        container.innerHTML = '<div class="empty-state"><h3>Your cart is empty</h3><p>Add items from the shop to get started.</p><a class="btn btn-primary" href="index.html">Continue shopping</a></div>';
        checkoutBtn.style.pointerEvents = 'none';
        checkoutBtn.style.opacity = '0.5';
        return;
      }
      let subtotal = 0;
      container.innerHTML = cart.map(item => {
        const product = PetSmartData.getProduct(item.id);
        if (!product) return '';
        const price = product.salePrice || product.price;
        subtotal += price * item.qty;
        return `
          <div class="cart-item">
            <img class="cart-item__image" src="${product.image}" alt="">
            <div>
              <h3 style="font-size:var(--text-base);">${product.name}</h3>
              <p class="text-muted text-small">${product.brand}</p>
              <label class="text-small">Qty <input type="number" min="1" value="${item.qty}" data-qty="${item.id}" style="width:60px; min-height:36px; padding:var(--space-1);"></label>
            </div>
            <div style="text-align:right;">
              <p style="font-weight:700;">${PetSmartData.formatPrice(price * item.qty)}</p>
              <button class="btn btn-ghost btn-sm" data-remove="${item.id}">Remove</button>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('subtotal').textContent = PetSmartData.formatPrice(subtotal);
      document.getElementById('total').textContent = PetSmartData.formatPrice(subtotal);
      container.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => { PetSmartCart.remove(btn.dataset.remove); renderCart(); });
      });
      container.querySelectorAll('[data-qty]').forEach(input => {
        input.addEventListener('change', () => { PetSmartCart.update(input.dataset.qty, parseInt(input.value, 10)); renderCart(); });
      });
    }
    renderCart();
  </script>
</body>
</html>
