<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — PetSmart Shop</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="header"><div class="header-inner">
    <a class="brand" href="../index.html"><span class="brand-text"><span class="pet">Pet</span><span class="smart">Smart</span></span></a>
    <form class="header-search search-bar" data-search-form data-base="../" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" name="q" id="search-input" placeholder="Search products…" aria-label="Search">
    </form>
    <div class="header-actions">
      <a class="header-action" href="cart.html" aria-label="Cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l3-8H7"/></svg><span class="cart-count" hidden>0</span></a>
    </div>
  </div></header>

  <main id="main">
    <div class="page-hero"><div class="page-hero__inner container">
      <h1>Search results</h1>
      <p id="search-summary">Showing results for your search.</p>
    </div></div>
    <div class="container" style="padding: var(--space-8) var(--space-4);">
      <div class="grid-4" id="product-grid"></div>
    </div>
  </main>

  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    const q = PetSmartParams.get('q') || '';
    const input = document.getElementById('search-input');
    if (input && q) input.value = q;
    const products = PetSmartData.getProducts({ query: q });
    document.getElementById('search-summary').textContent = q
      ? `${products.length} results for "${q}"`
      : 'Enter a search term above to find products.';
    PetSmartUI.renderProductGrid(document.getElementById('product-grid'), products, '../');
  </script>
</body>
</html>
