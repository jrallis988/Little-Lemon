<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — PetSmart Shop</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active="shop"></div>

  <main id="main">
    <div class="page-hero"><div class="page-hero__inner container">
      <h1>Search results</h1>
      <p id="search-summary">Showing results for your search.</p>
    </div></div>
    <div class="container" style="padding: var(--space-8) var(--space-4);">
      <div class="grid-4" id="product-grid"></div>
    </div>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    const q = PetSmartParams.get('q') || '';
    const input = document.getElementById('search-input');
    if (input && q) input.value = q;
    const products = PetSmartData.getProducts({ query: q });
    document.getElementById('search-summary').textContent = q
      ? `${products.length} results for "${q}"`
      : 'Enter a search term above to find products.';
    PetSmartUI.renderProductGrid(document.getElementById('product-grid'), products, '../');
  </script>
</body>
</html>
