<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — PetSmart Shop</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active="shop"></div>

  <main id="main">
    <div class="page-hero"><div class="page-hero__inner container">
      <ol class="breadcrumb"><li><a href="../index.html">Home</a></li><li><a href="index.html">Shop</a></li><li id="crumb-cat">Category</li></ol>
      <h1 id="cat-title">Category</h1>
      <p id="cat-desc"></p>
    </div></div>

    <div class="shop-layout">
      <aside class="filters-sidebar" id="filters" aria-label="Filters">
        <button type="button" class="btn btn-ghost btn-sm filters-close" id="filters-close">Close filters</button>
        <h3>Filter</h3>
        <fieldset class="filter-group">
          <legend>Price</legend>
          <label class="filter-option"><input type="checkbox" name="price" value="under-25"> Under $25</label>
          <label class="filter-option"><input type="checkbox" name="price" value="25-50"> $25 – $50</label>
          <label class="filter-option"><input type="checkbox" name="price" value="50-plus"> $50+</label>
        </fieldset>
        <fieldset class="filter-group" id="brand-filters">
          <legend>Brand</legend>
        </fieldset>
        <button type="button" class="btn btn-outline btn-sm" id="clear-filters">Clear filters</button>
      </aside>
      <div>
        <div class="shop-toolbar">
          <div>
            <button type="button" class="btn btn-outline btn-sm filters-toggle" id="filters-open">Filters</button>
            <p id="result-count" class="text-muted text-small" style="display:inline; margin-left:var(--space-3);"></p>
          </div>
          <label class="text-small">Sort by
            <select class="form-select" id="sort-select" style="width:auto; display:inline-block; margin-left:var(--space-2);">
              <option value="rating">Top rated</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <div class="grid-4" id="product-grid"></div>
      </div>
    </div>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const catSlug = PetSmartParams.get('cat') || 'dog-food';
    const cat = PetSmartData.getCategory(catSlug);
    if (cat) {
      document.title = `${cat.name} — PetSmart Shop`;
      document.getElementById('cat-title').textContent = cat.name;
      document.getElementById('crumb-cat').textContent = cat.name;
      document.getElementById('cat-desc').textContent = `Browse ${cat.name.toLowerCase()} from trusted brands.`;
    }

    const brandBox = document.getElementById('brand-filters');
    PetSmartData.brandsForCategory(catSlug).forEach((brand) => {
      brandBox.insertAdjacentHTML('beforeend',
        `<label class="filter-option"><input type="checkbox" name="brand" value="${brand}"> ${brand}</label>`);
    });

    const grid = document.getElementById('product-grid');
    const sortSelect = document.getElementById('sort-select');
    const filters = document.getElementById('filters');

    function selected(name) {
      return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map((el) => el.value);
    }

    function render() {
      const products = PetSmartData.getProducts({
        category: catSlug,
        sort: sortSelect.value,
        priceBands: selected('price'),
        brands: selected('brand'),
      });
      document.getElementById('result-count').textContent = `${products.length} products`;
      PetSmartUI.renderProductGrid(grid, products, '../');
    }

    document.querySelectorAll('input[name="price"], input[name="brand"]').forEach((el) => {
      el.addEventListener('change', render);
    });
    sortSelect.addEventListener('change', render);
    document.getElementById('clear-filters').addEventListener('click', () => {
      document.querySelectorAll('input[name="price"], input[name="brand"]').forEach((el) => { el.checked = false; });
      render();
    });
    document.getElementById('filters-open').addEventListener('click', () => filters.classList.add('is-open'));
    document.getElementById('filters-close').addEventListener('click', () => filters.classList.remove('is-open'));
    render();
  </script>
</body>
</html>
