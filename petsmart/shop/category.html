<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — PetSmart Shop</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="header"><div class="header-inner">
    <a class="brand" href="../index.html"><span class="brand-text"><span class="pet">Pet</span><span class="smart">Smart</span></span></a>
    <nav aria-label="Primary"><ul class="header-nav">
      <li><a href="index.html" aria-current="page">Shop</a></li>
      <li><a href="../services/index.html">Services</a></li>
      <li><a href="../adopt/index.html">Adopt</a></li>
      <li><a href="../care/index.html">Pet Care</a></li>
      <li><a href="../stores/index.html">Stores</a></li>
    </ul></nav>
    <div class="header-actions">
      <a class="header-action" href="cart.html" aria-label="Cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l3-8H7"/></svg><span class="cart-count" hidden>0</span></a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav"><span></span><span></span><span></span></button>
    </div>
  </div></header>
  <nav class="mobile-nav" id="mobile-nav"><ul><li><a href="index.html">Shop</a></li></ul></nav>

  <main id="main">
    <div class="page-hero"><div class="page-hero__inner container">
      <ol class="breadcrumb"><li><a href="../index.html">Home</a></li><li><a href="index.html">Shop</a></li><li id="crumb-cat">Category</li></ol>
      <h1 id="cat-title">Category</h1>
      <p id="cat-desc"></p>
    </div></div>

    <div class="shop-layout">
      <aside class="filters-sidebar" aria-label="Filters">
        <h3>Filter</h3>
        <fieldset class="filter-group">
          <legend>Pet type</legend>
          <label class="filter-option"><input type="checkbox" checked disabled> All pets</label>
        </fieldset>
        <fieldset class="filter-group">
          <legend>Price</legend>
          <label class="filter-option"><input type="checkbox"> Under $25</label>
          <label class="filter-option"><input type="checkbox"> $25 – $50</label>
          <label class="filter-option"><input type="checkbox"> $50+</label>
        </fieldset>
      </aside>
      <div>
        <div class="shop-toolbar">
          <p id="result-count" class="text-muted text-small"></p>
          <select class="form-select" id="sort-select" style="width:auto;">
            <option value="rating">Top rated</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
        </div>
        <div class="grid-4" id="product-grid"></div>
      </div>
    </div>
  </main>

  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    const catSlug = PetSmartParams.get('cat') || 'dog-food';
    const cat = PetSmartData.getCategory(catSlug);
    if (cat) {
      document.title = `${cat.name} — PetSmart Shop`;
      document.getElementById('cat-title').textContent = cat.name;
      document.getElementById('crumb-cat').textContent = cat.name;
      document.getElementById('cat-desc').textContent = `Browse ${cat.name.toLowerCase()} from trusted brands.`;
    }
    const grid = document.getElementById('product-grid');
    const sortSelect = document.getElementById('sort-select');
    function render() {
      const products = PetSmartData.getProducts({ category: catSlug, sort: sortSelect.value });
      document.getElementById('result-count').textContent = `${products.length} products`;
      PetSmartUI.renderProductGrid(grid, products, '../');
    }
    sortSelect.addEventListener('change', render);
    render();
  </script>
</body>
</html>
