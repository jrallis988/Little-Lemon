<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed — PetSmart</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active="services"></div>
  <main id="main">
    <div class="confirm-panel">
      <div class="confirm-panel__icon" aria-hidden="true">✓</div>
      <h1>You’re booked</h1>
      <p class="text-muted" style="margin:var(--space-4) 0;" id="confirm-copy">Your demo appointment is confirmed.</p>
      <div class="cart-summary" id="confirm-details" style="text-align:left; margin:var(--space-6) auto;"></div>
      <div style="display:flex; gap:var(--space-4); justify-content:center; flex-wrap:wrap;">
        <a class="btn btn-primary" href="index.html">Browse services</a>
        <a class="btn btn-outline" href="../stores/index.html">View stores</a>
      </div>
    </div>
  </main>
  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let data = {};
    try { data = JSON.parse(sessionStorage.getItem('petsmart-booking') || '{}'); } catch {}
    const service = PetSmartData.services.find(s => s.id === data.service);
    const opt = (PetSmartData.getBookingOptions(data.service) || []).find(o => o.id === data.option);
    const store = PetSmartData.getStore(data.store);
    document.getElementById('confirm-copy').textContent =
      `Thanks — ${data.pet || 'your pet'} is scheduled for ${service?.name || 'a service'}.`;
    document.getElementById('confirm-details').innerHTML = `
      <p><strong>${opt?.name || service?.name || 'Service'}</strong></p>
      <p>${store?.name || ''} · ${data.date || ''} ${data.time || ''}</p>
      <p class="form-hint" style="margin-top:var(--space-3);">Demo only — no live booking was created.</p>
    `;
  </script>
</body>
</html>
