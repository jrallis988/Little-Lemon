<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetSmart services — grooming, dog training, Doggie Day Camp, and veterinary connections.">
  <title>Services — PetSmart</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active="services"></div>

  <main id="main">
    <div class="page-hero">
      <div class="page-hero__inner container">
        <h1>Pet services</h1>
        <p>Professional grooming, training, day camp, and veterinary connections — book care that keeps your pet healthy and happy.</p>
      </div>
    </div>
    <section class="section">
      <div class="container">
        <div class="grid-2" id="services-grid"></div>
      </div>
    </section>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    const links = { grooming: 'grooming.html', training: 'training.html', 'day-camp': 'day-camp.html', vet: 'vet.html' };
    document.getElementById('services-grid').innerHTML = PetSmartData.services.map(s => `
      <article class="card reveal">
        <div class="card__media"><img src="${s.image}" alt="" loading="lazy"></div>
        <div class="card__body">
          <h2 class="card__title">${s.name}</h2>
          <p class="card__text">${s.description}</p>
          <a class="btn btn-secondary" href="${links[s.id] || 'index.html'}" style="margin-top:var(--space-4);">${s.cta}</a>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
