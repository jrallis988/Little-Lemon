<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find PetSmart store locations near you for shopping, grooming, training, and adoption events.">
  <title>Store Locator — PetSmart</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active="stores"></div>

  <main id="main">
    <div class="page-hero">
      <div class="page-hero__inner container">
        <h1>Find a store</h1>
        <p>1,600+ PetSmart locations with grooming, training, adoption events, and in-store pickup.</p>
        <form class="search-bar" style="max-width:480px; margin-top:var(--space-6); background:var(--ps-white);" role="search" id="store-search-form">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="store-query" placeholder="City, state, or ZIP" aria-label="Search stores">
        </form>
      </div>
    </div>
    <section class="section"><div class="container" style="display:grid; gap:var(--space-4);" id="stores-list"></div></section>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script><script src="../js/ui.js"></script><script src="../js/app.js"></script>
  <script>
    const list = document.getElementById('stores-list');
    const query = document.getElementById('store-query');
    function render() {
      const q = (query.value || '').toLowerCase();
      const stores = PetSmartData.stores.filter(s =>
        !q || `${s.city} ${s.state} ${s.zip} ${s.name}`.toLowerCase().includes(q)
      );
      list.innerHTML = stores.length
        ? stores.map(s => PetSmartUI.storeCard(s, '../')).join('')
        : '<div class="empty-state"><h3>No stores found</h3><p>Try a different city or ZIP code.</p></div>';
    }
    query.addEventListener('input', render);
    render();
  </script>
</body>
</html>
