<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments — PetSmart Account</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="ps-header" data-base="../" data-active=""></div>

  <main id="main">
    <div class="page-hero">
      <div class="page-hero__inner container">
        <h1>Appointments</h1>
        <p>Grooming, training, and day camp bookings saved in this browser.</p>
      </div>
    </div>
    <div class="container" style="padding:var(--space-8) var(--space-4); max-width:var(--container-lg);">
      <div id="appointments-list" style="display:grid; gap:var(--space-4);"></div>
      <p style="margin-top:var(--space-8);">
        <a class="btn btn-outline" href="../services/index.html">Book a new service</a>
      </p>
    </div>
  </main>

  <div id="ps-footer" data-base="../"></div>
  <script src="../js/chrome.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const list = document.getElementById('appointments-list');
    const appts = PetSmartAppointments.get();
    if (!appts.length) {
      list.innerHTML = `<div class="empty-state"><h3>No appointments yet</h3><p>Book grooming, training, or day camp and they’ll show up here.</p><a class="btn btn-primary" href="../services/book.html?service=grooming">Book a service</a></div>`;
    } else {
      list.innerHTML = appts.map((a) => {
        const service = PetSmartData.services.find(s => s.id === a.service);
        const opt = (PetSmartData.getBookingOptions(a.service) || []).find(o => o.id === a.option);
        const store = PetSmartData.getStore(a.store);
        return `
          <article class="card"><div class="card__body" style="display:flex; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap; align-items:center;">
            <div>
              <p class="badge badge--blue" style="margin-bottom:var(--space-2);">${service?.name || a.service}</p>
              <h2 style="font-size:var(--text-lg); margin-bottom:var(--space-2);">${opt?.name || 'Appointment'}</h2>
              <p class="text-muted text-small">${a.pet || 'Pet'} · ${a.date || ''} ${a.time || ''}</p>
              <p class="text-small">${store?.name || ''} — ${store?.city || ''}</p>
            </div>
            <button class="btn btn-ghost btn-sm" type="button" data-cancel="${a.id}">Remove</button>
          </div></article>
        `;
      }).join('');
      list.querySelectorAll('[data-cancel]').forEach((btn) => {
        btn.addEventListener('click', () => {
          PetSmartAppointments.remove(btn.dataset.cancel);
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
