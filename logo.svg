<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="The East Coast Motion Picture Company">
  <defs>
    <filter id="magentaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="frameGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="magentaCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6fb"/>
      <stop offset="45%" stop-color="#ff5fd2"/>
      <stop offset="100%" stop-color="#c2188a"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ffff"/>
      <stop offset="50%" stop-color="#5cf0ff"/>
      <stop offset="100%" stop-color="#18a8c2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#000000"/>

  <!-- Art Deco stepped frame -->
  <path
    d="M90 70
       H1110
       Q1140 70 1140 100
       V270
       L1110 300
       H1080
       V320
       H120
       V300
       H90
       L60 270
       V100
       Q60 70 90 70 Z"
    fill="none"
    stroke="#ff4ec8"
    stroke-width="3.5"
    filter="url(#frameGlow)"
    opacity="0.95"
  />
  <path
    d="M102 82
       H1098
       Q1118 82 1118 102
       V258
       L1095 282
       H1070
       V298
       H130
       V282
       H105
       L82 258
       V102
       Q82 82 102 82 Z"
    fill="none"
    stroke="#7aebff"
    stroke-width="1.25"
    opacity="0.55"
  />

  <!-- EAST COAST - Art Deco inline style via twin strokes -->
  <g filter="url(#magentaGlow)" text-anchor="middle">
    <text x="600" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" letter-spacing="18" fill="none" stroke="#ff2db8" stroke-width="8" opacity="0.55">EAST COAST</text>
    <text x="600" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" letter-spacing="18" fill="none" stroke="#ff9ae0" stroke-width="3.5">EAST COAST</text>
    <text x="600" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" letter-spacing="18" fill="#fff7fd">EAST COAST</text>
  </g>

  <!-- MOTION PICTURE COMPANY -->
  <g filter="url(#cyanGlow)" text-anchor="middle">
    <text x="600" y="265" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="14" fill="#7af6ff">MOTION PICTURE COMPANY</text>
  </g>
</svg>
