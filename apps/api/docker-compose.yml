services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biocross
      POSTGRES_PASSWORD: biocross
      POSTGRES_DB: biocross
    ports:
      - "5432:5432"
    volumes:
      - biocross_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biocross"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: local-dev-secret
      DATABASE_URL: postgresql://biocross:biocross@db:5432/biocross
    depends_on:
      db:
        condition: service_healthy

volumes:
  biocross_pg:
