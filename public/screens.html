<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smuttynose — Screen Previews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0c1620;
        --foam: #f1f4f6;
        --buoy: #d94e1f;
        --steel: #5c6b75;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-snap-type: y mandatory; }
      body {
        margin: 0;
        font-family: Figtree, system-ui, sans-serif;
        background: var(--ink);
        color: var(--foam);
      }
      .topbar {
        position: fixed; inset: 0 0 auto; z-index: 20;
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; padding: 0.85rem 1.25rem;
        background: rgba(12, 22, 32, 0.92);
        border-bottom: 1px solid rgba(241, 244, 246, 0.12);
        backdrop-filter: blur(10px);
      }
      .topbar h1 {
        margin: 0; font-family: Oswald, sans-serif; font-size: 1rem;
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      .topbar a { color: var(--foam); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
      .topbar a.site { background: var(--buoy); padding: 0.5rem 0.85rem; }
      .nav-dots {
        position: fixed; right: 1rem; top: 50%; z-index: 20;
        display: flex; flex-direction: column; gap: 0.45rem;
        transform: translateY(-50%);
      }
      .nav-dots a {
        width: 0.55rem; height: 0.55rem; border-radius: 999px;
        background: rgba(241, 244, 246, 0.28); text-indent: -9999px; overflow: hidden;
      }
      .nav-dots a:hover, .nav-dots a:focus-visible { background: var(--buoy); }
      .screen {
        min-height: 100svh; scroll-snap-align: start;
        display: grid; grid-template-rows: auto 1fr;
        padding: 5rem 1.25rem 2rem;
      }
      .screen-meta {
        max-width: 72rem; width: 100%; margin: 0 auto 1rem;
        display: flex; flex-wrap: wrap; align-items: baseline;
        justify-content: space-between; gap: 0.5rem 1rem;
      }
      .screen-meta .label {
        font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em;
        text-transform: uppercase; color: rgba(241, 244, 246, 0.55);
      }
      .screen-meta h2 {
        margin: 0.2rem 0 0; font-family: Oswald, sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.3rem); letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .screen-meta .count { font-size: 0.85rem; color: var(--steel); }
      .frame {
        max-width: 72rem; width: 100%; margin: 0 auto;
        border: 1px solid rgba(241, 244, 246, 0.14);
        background: #060b10; overflow: auto;
        display: flex; align-items: flex-start; justify-content: center;
      }
      .frame.mobile { max-width: 28rem; }
      .frame img { display: block; width: 100%; height: auto; }
      .pager {
        position: fixed; left: 50%; bottom: 1.1rem; z-index: 20;
        transform: translateX(-50%); display: flex; gap: 0.5rem;
      }
      .pager a {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 6.5rem; padding: 0.65rem 1rem;
        background: rgba(241, 244, 246, 0.1);
        border: 1px solid rgba(241, 244, 246, 0.25);
        color: var(--foam); text-decoration: none;
        font-size: 0.85rem; font-weight: 600;
      }
      .pager a:hover { background: var(--buoy); border-color: var(--buoy); }
      @media (max-width: 700px) {
        .nav-dots { display: none; }
        .screen { padding: 4.5rem 0.75rem 4.5rem; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <h1>Smuttynose · Screen Previews</h1>
      <a class="site" href="./">Open live site</a>
    </header>

    <nav class="nav-dots" aria-label="Jump to screen" id="dots"></nav>

    <div id="screens"></div>

    <div class="pager" aria-label="Previous and next screen">
      <a id="prev" href="#age-gate">← Prev</a>
      <a id="next" href="#hero-desktop">Next →</a>
    </div>

    <script>
      const screens = [
        ["age-gate", "Age gate", "preview-age-gate.png", false],
        ["hero-desktop", "Hero · Desktop", "preview-hero-desktop.png", false],
        ["hero-mobile", "Hero · Mobile", "preview-hero-mobile.png", true],
        ["beers", "On tap now", "preview-beers.png", false],
        ["events", "Events", "preview-events.png", false],
        ["food", "Food", "preview-food.png", false],
        ["gallery", "Campus gallery", "preview-gallery.png", false],
        ["visit", "Visit / Towle Farm", "preview-visit.png", false],
        ["shop-home", "Shop, loyalty & Suds Club", "preview-shop.png", false],
        ["contact", "Contact", "preview-contact.png", false],
        ["newsletter", "Newsletter", "preview-newsletter.png", false],
        ["story", "Story + footer", "preview-story.png", false],
        ["mobile-menu", "Mobile menu drawer", "preview-mobile-menu.png", true],
        ["beer-pdp", "Beer product detail", "preview-beer-pdp.png", false],
        ["shop-cart", "Merch catalog + cart", "preview-shop-cart.png", false],
        ["finder", "Beer finder map", "preview-finder.png", false],
        ["private-events", "Private events booking", "preview-private-events.png", false],
      ];

      const root = document.getElementById("screens");
      const dots = document.getElementById("dots");
      const ids = screens.map((s) => s[0]);

      screens.forEach(([id, title, file, mobile], i) => {
        const n = String(i + 1).padStart(2, "0");
        root.insertAdjacentHTML(
          "beforeend",
          `<section class="screen" id="${id}">
            <div class="screen-meta">
              <div>
                <p class="label">Screen ${n}</p>
                <h2>${title}</h2>
              </div>
              <p class="count">${i + 1} / ${screens.length}</p>
            </div>
            <div class="frame${mobile ? " mobile" : ""}">
              <img src="./previews/${file}" alt="${title}" />
            </div>
          </section>`,
        );
        dots.insertAdjacentHTML(
          "beforeend",
          `<a href="#${id}" title="${title}">${i + 1}</a>`,
        );
      });

      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      function currentIndex() {
        const y = window.scrollY + window.innerHeight * 0.35;
        let idx = 0;
        for (let i = 0; i < ids.length; i++) {
          const el = document.getElementById(ids[i]);
          if (el && el.offsetTop <= y) idx = i;
        }
        return idx;
      }
      function syncPager() {
        const i = currentIndex();
        prev.href = `#${ids[Math.max(0, i - 1)]}`;
        next.href = `#${ids[Math.min(ids.length - 1, i + 1)]}`;
      }
      window.addEventListener("scroll", syncPager, { passive: true });
      syncPager();
    </script>
  </body>
</html>
