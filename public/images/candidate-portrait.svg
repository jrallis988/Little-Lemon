<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="Campaign portrait of Morgan Hale outdoors in New Hampshire">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A96A8"/>
      <stop offset="55%" stop-color="#B7C4B0"/>
      <stop offset="100%" stop-color="#C9B896"/>
    </linearGradient>
    <linearGradient id="trees" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D5A45"/>
      <stop offset="100%" stop-color="#1C3A2C"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4149"/>
      <stop offset="100%" stop-color="#1F252B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6C3A5"/>
      <stop offset="100%" stop-color="#C99574"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#sky)"/>
  <path d="M0 520 L120 460 L220 500 L340 400 L460 480 L580 390 L720 460 L720 900 L0 900 Z" fill="url(#trees)" opacity="0.85"/>
  <path d="M0 620 L720 580 L720 900 L0 900 Z" fill="#243028"/>
  <!-- shoulders / coat -->
  <ellipse cx="360" cy="820" rx="220" ry="160" fill="url(#coat)"/>
  <rect x="220" y="620" width="280" height="220" rx="20" fill="url(#coat)"/>
  <!-- neck -->
  <rect x="325" y="470" width="70" height="80" fill="url(#skin)"/>
  <!-- head -->
  <ellipse cx="360" cy="360" rx="110" ry="130" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M250 340 Q260 220 360 210 Q460 220 470 340 Q450 250 360 245 Q270 250 250 340 Z" fill="#2C333A"/>
  <!-- features simplified -->
  <ellipse cx="320" cy="350" rx="12" ry="8" fill="#2C333A"/>
  <ellipse cx="400" cy="350" rx="12" ry="8" fill="#2C333A"/>
  <path d="M340 400 Q360 415 380 400" fill="none" stroke="#A06B4F" stroke-width="6" stroke-linecap="round"/>
  <!-- collar -->
  <path d="M300 620 L360 560 L420 620 Z" fill="#F2F3F1"/>
  <rect x="345" y="560" width="30" height="90" fill="#2D5A45"/>
</svg>
