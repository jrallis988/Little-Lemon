<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 168" role="img" aria-label="Nick Varga — To represent the state of New Hampshire">
  <!-- Wordmark: tall V-arrow + NICK / ARGA + star rule + tagline -->
  <g fill="#1a2a4e">
    <!-- Left V leg -->
    <path d="M52 12 L108 128 L140 128 L78 12 Z"/>
    <!-- Right V leg into upward arrow -->
    <path d="M78 12 L132 128 L164 128 L198 52 L232 78 L256 54 L188 12 Z"/>
  </g>
  <!-- Red stripe through left leg -->
  <path d="M68 22 L118 122 L128 122 L80 22 Z" fill="#e63946"/>

  <!-- NICK over ARGA (V supplied by graphic) -->
  <text x="268" y="58" fill="#1a2a4e" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" letter-spacing="0.18em">NICK</text>
  <text x="268" y="122" fill="#1a2a4e" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="0.04em">ARGA</text>

  <!-- Rule + gold star -->
  <line x1="28" y1="144" x2="508" y2="144" stroke="#1a2a4e" stroke-width="2"/>
  <polygon points="528,136 531.2,143.2 539,144.2 533.2,149.2 534.8,157 528,152.8 521.2,157 522.8,149.2 517,144.2 524.8,143.2" fill="#f4d03f"/>

  <text x="28" y="162" fill="#1a2a4e" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.2em">TO REPRESENT THE STATE OF NEW HAMPSHIRE.</text>
</svg>
